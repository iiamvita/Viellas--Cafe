<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Viella's Café</title>
    <meta name="description" content="Welcome to Viella's Café. Fall in love with every sip. Discover our artisanal coffees, teas and mouthwatering pastries.">
    <!-- CSS -->
    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body>

    <!-- Header will load here -->
    <div id="header"></div>

    <!-- Main content will load here -->
    <div id="main"></div>

    <!-- Footer will load here -->
    <div id="footer"></div>

    <!-- JavaScript to load HTML files -->
    <script src="../JS/headerScroll.js"></script>
    <script>
        fetch("header.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("header").innerHTML = data;
                setupHeaderScroll();
                setupMobileMenu();
            });

        fetch("main.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("main").innerHTML = data;
            });

        fetch("footer.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("footer").innerHTML = data;
            });
    </script>

</body>

</html>
